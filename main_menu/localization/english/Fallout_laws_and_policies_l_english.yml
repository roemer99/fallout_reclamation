l_english:
 vault_isolation_law: "Isolation Policy"
 vault_isolation_law_desc: "Determines the Vault's stance on interaction with the post-nuclear wasteland. From strict containment to full reintegration, this policy dictates the level of exposure our dwellers have to the outside world."
 isolation_isolationism: "Isolationism"
 isolation_isolationism_desc: "Strict quarantine protocols are enforced. The Vault door remains sealed to prevent any external contamination or threats from entering, ensuring total security at the cost of external resources."
 isolation_limited_contacts: "Limited Contacts"
 isolation_limited_contacts_desc: "Controlled exchange is permitted. Trade and travel are heavily regulated, allowing for necessary resource gathering and diplomatic missions while minimizing exposure to the wasteland."
 isolation_unrestricted: "Open Door"
 isolation_unrestricted_desc: "Free movement is authorized. The Vault fully integrates with the surface, allowing unrestricted migration and commerce with local settlements to maximize growth and influence."
 vault_religious_law: "Religious Practices"
 vault_religious_law_desc: "This law group dictates how the Overseer handles spiritual beliefs, pre-war religions, or emerging cults within the confined space of the Vault."
 strict_secularism: "Strict Secularism"
 strict_secularism_desc: "Religion is officially unrecognized and religious gatherings are prohibited to maintain absolute focus on science and the Vault experiment."
 sanctioned_pre_war_chapels: "Sanctioned Pre-War Chapels"
 sanctioned_pre_war_chapels_desc: "The Vault includes small, non-denominational chapels (like the one in Vault 101), allowing dwellers to quietly practice pre-war faiths on their own time."
 cult_of_overseer: "Cult of the Overseer"
 cult_of_overseer_desc: "All spiritual needs are forcibly redirected into worshipping the Overseer as a flawless, god-like protector of the Vault."
 techno_worship: "Techno-Worship"
 techno_worship_desc: "The dwellers have begun to worship the Vault's life-sustaining technology - such as the water chip, the reactor, or the G.E.C.K. - as divine artifacts."
 vault_marriage_law: "Marriage Law"
 vault_marriage_law_desc: "In a sealed underground environment, marriage laws are less about religion and entirely focused on population control and preventing inbreeding."
 regulated_breeding: "Regulated Breeding"
 regulated_breeding_desc: "Overseer and medical staff assign reproductive partners strictly based on genetic compatibility"
 closed_vault_endogamy: "Closed-Vault Endogamy"
 closed_vault_endogamy_desc: "Dwellers can marry whoever they want within the Vault, but relations with anyone from the surface are strictly forbidden."
 surface_integration: "Surface Integration"
 surface_integration_desc: "The Vault doors are open, and dwellers are legally allowed to marry Wastelanders."
 vault_tec_override: "Vault-Tec Override"
 vault_tec_override_desc: "Only approved educational holotapes and Overseer-sanctioned propaganda are accessible."
 vault_censorship_law: "Censorship"
 vault_censorship_law_desc: "This dictates how much of the pre-war archives and internal Vault-Tec data the general dwellers are allowed to see."
 clearance_level_access: "Clearance-Level Access"
 clearance_level_access_desc: "Terminal access is strictly segmented by job assignment (e.g., Security, Medical, Engineering)."
 open_mainframe: "Open Mainframe"
 open_mainframe_desc: "All dwellers have unrestricted access to the Vault's pre-war historical and scientific archives."
 strict_rationing: "Strict Rationing"
 strict_rationing_desc: "The Overseer controls every drop of water and every calorie."
 vault_ressources_law: "Resource Allocation"
 vault_ressources_law_desc: "Since Vaults do not use scrap or bottle caps internally, this law defines how the Vault's pristine resources (purified water, nutrient paste, electricity) are distributed."
 merit_based: "Merit-Based Allotment"
 merit_based_desc: "Extra rations and luxuries are granted to those in critical maintenance or security roles."
 utopian_abundance: "Utopian Abundance"
 utopian_abundance_desc: "The Vault's reactors and purifiers run at full capacity, providing limitless resources to all dwellers."
 vault_cultural_law: "Cultural Traditions"
 vault_cultural_law_desc: "How do dwellers spend their limited free time, and what binds them together in isolation?"
 vault_supremacy: "Vault Supremacy"
 vault_supremacy_desc: "The culture revolves around the belief that the Vault is the last bastion of true humanity and the surface is entirely tainted."
 pre_war_preservation: "Pre-War Preservation"
 pre_war_preservation_desc: "Dwellers obsessively consume 1950s holotapes, Grognak comics, and play baseball in the atrium."
 utilitarian_survivalism: "Utilitarian Survivalism"
 utilitarian_survivalism_desc: "Leisure is considered a waste of calories. Culture is non-existent; only work and survival matter."
 vault_education_law: "Education"
 vault_education_law_desc: "How the next generation is trained to keep the Vault running."
 goat_standardization: "G.O.A.T. Standardization"
 goat_standardization_desc: "At age 16, every child takes the Generalized Occupational Aptitude Test, rigidly locking them into a lifelong career."
 overseer_indoctrination: "Overseer Youth Indoctrination"
 overseer_indoctrination_desc: "Education is primarily focused on absolute loyalty to Vault-Tec and the Overseer."
 generational_apprenticeship: "Generational Apprenticeship"
 generational_apprenticeship_desc: "Children do not go to a general school but are raised directly in the departments of their parents (Engineers raise Engineers)."
 vault_legal_code_law: "Legal Code"
 vault_legal_code_law_desc: "This dictates how infractions and crimes are punished within the confined space of the Vault."
 vault_tec_regulations: "Vault-Tec Regulations"
 vault_tec_regulations_desc: "Standard protocol. Minor infractions result in ration cuts or temporary confinement in the security brig."
 mandatory_rehabilitation: "Mandatory Rehabilitation"
 mandatory_rehabilitation_desc: "Criminals are subjected to intense psychological re-education or forced labor in the reactor levels."
 surface_banishment: "Surface Banishment"
 surface_banishment_desc: "Serious criminals are stripped of their gear, forced out the Vault door, and permanently exiled into the Wasteland."
 vault_administrative_law: "Administrative System"
 vault_administrative_law_desc: "This defines how the complex logistics of the Vault (air filtration, shift schedules, maintenance) are structured and executed."
 zax_mainframe_automation: "ZAX Mainframe Automation"
 zax_mainframe_automation_desc: "A central supercomputer handles all logistics and resource allocation, removing human error."
 administrative_department: "Administrative Department"
 administrative_department_desc: "Day-to-day administration is fully delegated to the department offices. Medical, Security, and Engineering independently manage their own operations, staff, and internal protocols."
 executive_overseer: "Executive Overseer"
 executive_overseer_desc: "All administrative tasks, logistics, and broad operational directives flow directly through the Overseer. The departments act strictly as subordinates executing central orders."
 vault_security_law: "Security Protocol"
 vault_security_law_desc: "This dictates the doctrine, armaments, and role of the Vault Security team (the 'Military' estate within a Vault)."
 total_surveillance: "Total Surveillance"
 total_surveillance_desc: "Security officers patrol every corridor in full riot gear, conducting random searches and monitoring all terminals."
 perimeter_lockdown: "Perimeter Lockdown"
 perimeter_lockdown_desc: "Internal policing is relaxed, and almost all security personnel and automated turrets are stationed directly at the Vault Door to prevent any external breaches."
 civilian_militia: "Civilian Militia"
 civilian_militia_desc: "The dedicated security department is disbanded to save resources. Instead, regular dwellers are issued 10mm pistols and expected to maintain order alongside their normal jobs."
 minimized_presence: "Minimized Presence"
 minimized_presence_desc: "Only a handful of security officers are kept on active duty. They function more as dispute mediators or emergency responders rather than a standing armed force, keeping the Vault peaceful but largely unpoliced."
 vault_science_law: "Scientific Directive"
 vault_science_law_desc: "This law dictates the primary objective of the Vault's white-collar departments (Medical and Science), determining what the Overseer allows them to prioritize." 
 medical_focus: "Medical Focus"
 medical_focus_desc: "The scientific staff is entirely dedicated to synthesizing medicines, curing diseases, and ensuring the long-term health of the dwellers."
 engineering_focus: "Engineering Focus"
 engineering_focus_desc: "Research is heavily focused on maintaining and upgrading the Vault's physical infrastructure, such as reactor output and hydroponics efficiency."
 unrestricted_experimentation: "Unrestricted Experimentation"
 unrestricted_experimentation_desc: "The Overseer gives the scientists a blank check to pursue the original, often unethical, Vault-Tec secret experiment (e.g., genetic splicing, psychological stress tests)."
 agricultural_focus: "Agricultural Focus"
 agricultural_focus_desc: "This law group determines how the Vault feeds its population, managing the delicate balance between calorie output, water consumption, and dweller morale in a closed-loop ecosystem."