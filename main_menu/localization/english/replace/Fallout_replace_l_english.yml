 # Keys that intentionally override vanilla localization.
 # Files in localization/<language>/replace/ win over vanilla keys without a duplicate-key error.

 # Government names
 country_flavor_parliament_council: "Council"

 # Government power: legitimacy is used by vault_government as "Overseer Authority"
 # (no other monarchies exist in the mod)
 legitimacy: "Overseer Authority"
 game_concept_legitimacy: "Overseer Authority"
 game_concept_legitimacy_desc: "Overseer Authority measures how firmly the Overseer controls the Vault. Dwellers and estates obey an Overseer with high authority, while a weak Overseer faces dissent, sabotage and open defiance. It suffers when the Vault runs short of water or energy."
 MODIFIER_TYPE_NAME_monthly_legitimacy: "Monthly Overseer Authority"
 MODIFIER_TYPE_DESC_monthly_legitimacy: "This impacts how much [legitimacy|e] a [country|e] gets each month."
 MODIFIER_TYPE_NAME_global_estate_satisfaction_from_legitimacy: "Estates Satisfaction Equilibrium from Overseer Authority"

