 # Goods
 wheat: "Razorgrain"
 wheat_desc: "A mutated, extremely hardy grain variety that thrives even in the irradiated soil of the Wasteland. Its razor-sharp husks make harvesting a painful endeavor, yet the coarse flour derived from it remains an essential staple for survival in the post-apocalypse."

 # Country history (customizable_localization/country_history.txt)
 country_history_america: "Once a continent defined by vast nations, sprawling cities, and unmatched industrial might, North America now stands fractured in the wake of devastation. Endless plains, mountain ranges, and shattered coasts shelter scattered survivors—tribes, enclaves, warlords, and fledgling nations rising from the remnants of the old world. The continent’s great pre-War arteries of trade and travel lie silent, yet their ruins remain rich with salvage, forgotten technology, and lingering dangers.\n\nPower is fragmented and unstable. Some regions cling to scraps of old-world order, organizing around fortified settlements or preserved government bunkers. Others descend into chaos, ruled by militias, raiders, or charismatic leaders promising safety—or conquest. Nature slowly reclaims the land, but the scars of catastrophe run deep: abandoned cities glow faintly at night, mutated wildlife stalks the frontier, and strange phenomena linger where the bombs fell hardest.\n\nYet North America is still a land of opportunity. Its people, diverse and resilient, look to rebuild their own destinies amid the wasteland. Whether guided by idealism, ambition, or simple survival, new powers rise each year, seeking to unify, dominate, or protect the continent. In the ruins of the old world, the future is unwritten—and every faction believes it can shape the new one."

 # Ages (advances_l_english)
 age_1_traditions: "Survival"
 age_1_traditions_desc: "The world lies in ruins. Factions crawl from the ashes — starving, scattered, afraid. In the silence after the bombs, survival is the only law."
 age_2_renaissance: "Reclamation"
 age_2_renaissance_desc: "Humanity begins to rebuild. Farms return to dead soil, settlements rise among the ruins, and the first flickers of order pierce the wasteland’s chaos."
 age_3_discovery: "Rediscovery"
 age_3_discovery_desc: "Old-world machines awaken once more. Lost knowledge resurfaces, science rekindles, and those who master forgotten technologies gain the power to shape the future."
 age_4_reformation: "Expansion"
 age_4_reformation_desc: "Ambitious states push outward, carving borders across the wasteland. Armies march, ideologies clash, and the struggle to define the new world begins."
 age_5_absolutism: "Unification"
 age_5_absolutism_desc: "Superpowers rise from the dust. Roads, trade, and diplomacy reconnect the continent as great nations vie to unite — or dominate — North America."
 age_6_revolutions: "Ascendance"
 age_6_revolutions_desc: "Civilization surpasses the old. With advanced science, restored cities, and post-human innovation, the world stands on the brink of a new era of power and possibility."
