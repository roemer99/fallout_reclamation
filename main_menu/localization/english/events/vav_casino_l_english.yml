l_english:
 # Panel buttons (gui/panels/situation/vault_management.gui)
 VAULT_MGMT_VAV_ROULETTE: "Play Roulette"
 VAULT_MGMT_VAV_ROULETTE_TT: "Place a bet at the roulette wheel. The Vault's fortune is the stake:\n#P Red / Black / Odd / Even: +10 Fortune#!\n#P Zero: +35 Fortune#!\n#N Wrong bet: -10 Fortune#!\n\nThe wheel spins once per month."
 vav_roulette_cooldown_tt: "The roulette wheel has already been played this month."
 VAULT_MGMT_VAV_CARAVAN: "Play Caravan"
 VAULT_MGMT_VAV_CARAVAN_TT: "Challenge a dweller to a game of Caravan: build three caravans worth 21 to 26 each, with number cards and face cards (Jack, Queen, King, Joker). Press #T ?#! for the full rules.\n#P Win: +15 Fortune#!\n#N Lose: -15 Fortune#!\n\nOne game per month."
 vav_caravan_cooldown_tt: "A game of Caravan has already been played this month."

 # "?" rules buttons (events/vaults/vav_rules.txt)
 VAV_RULES_BUTTON: "#bold ?#!"
 VAV_RULES_BUTTON_TT: "How to play"
 vav_rules.ok: "Got it."
 vav_rules.1.title: "How to Play: Blackjack"
 vav_rules.1.desc: "#T Goal#!\nGet closer to 21 than the dealer without going over.\n\n#T Cards#!\nNumber cards count their value, Jack, Queen and King count 10. An Ace counts 11, or 1 if 11 would take you over 21.\n\n#T Play#!\nYou get two cards, the dealer shows one. Choose #T Hit#! to draw another card or #T Stand#! to stop. Over 21 you lose at once. When you stand, the dealer draws until reaching at least 17.\n\n#T Stakes#!\n#P Win: +10 Fortune#!  -  #P Blackjack (21 with your first two cards): +15 Fortune#!\n#N Lose: -10 Fortune#!  -  A tie changes nothing.\n\nOne game per month."
 vav_rules.2.title: "How to Play: Roulette"
 vav_rules.2.desc: "#T The wheel#!\nA European wheel with 37 numbers: 18 red, 18 black and the green zero.\n\n#T Bets#!\n#T Red#! or #T Black#!: the colour of the number.\n#T Odd#! or #T Even#!: zero counts as neither.\n#T Zero#!: everything on the green zero.\n\n#T Stakes#!\n#P Red / Black / Odd / Even right: +10 Fortune#!\n#P Zero right: +35 Fortune#!\n#N Wrong: -10 Fortune#!\n\nOne spin per month."
 vav_rules.3.title: "How to Play: Caravan"
 vav_rules.3.desc: "#T Goal#!\nYou and your opponent each build three caravans. A caravan is #P sold#! with a total of 21 to 26; over 26 it is #N busted#!. After 9 turns each caravan is compared with the opponent's caravan in the same row: a sold caravan beats an unsold one, between two sold ones the higher total wins. Win two of three to win the game.\n\n#T Your turn#!\nPlay the card in your hand with #T Play#! under one of your caravans, or throw it away with #T Discard#!. Then your opponent plays, and you draw a new card.\n\n#T Number cards#!\nAce = 1, 2-10 = their value: added to the chosen caravan.\n\n#T Face cards#! (act at once, are not placed)\n#T Jack#!: removes the top card of the opponent's caravan in that row.\n#T Queen#!: takes back the top card of your own caravan (rescue a busted one).\n#T King#!: the top card of your caravan counts double.\n#T Joker#!: clears the opponent's caravan in that row completely.\nYour opponent uses face cards too.\n\n#T Stakes#!\n#P Win: +15 Fortune#!  -  #N Lose or forfeit: -15 Fortune#!  -  A draw changes nothing.\n\nOne game per month."

 # Face card hints under the hand card (gui/fallout_caravan_cards.gui)
 VAV_CV_HINT_JACK: "#T Jack:#! removes the top card of the opponent's caravan in the row you play it on."
 VAV_CV_HINT_QUEEN: "#T Queen:#! takes back the top card of your caravan in that row."
 VAV_CV_HINT_KING: "#T King:#! the top card of your caravan in that row counts double."
 VAV_CV_HINT_JOKER: "#T Joker:#! clears the opponent's caravan in that row completely."

