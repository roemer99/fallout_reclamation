 # ---------------------------------------------------------------------------
 # Roulette (events/vaults/vav_roulette.txt)
 # ---------------------------------------------------------------------------
 vav_roulette.1.title: "Roulette"
 vav_roulette.1.desc: "The croupier sets the old wheel spinning and the little ball rattles along its rim. Thirty-seven numbers: eighteen red, eighteen black and the green zero.\n\nWhere does Vault 21 place its bet?"
 vav_roulette.1.a: "Red."
 vav_roulette.1.b: "Black."
 vav_roulette.1.c: "Odd."
 vav_roulette.1.d: "Even."
 vav_roulette.1.e: "Everything on zero!"

 vav_roulette.2.title: "Winner!"
 vav_roulette.2.desc: "The ball settles on #R [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_rl_number_display')|0] Red#!.\n\nThe bet pays off and the chips pile up in front of the Overseer."
 vav_roulette.2.a: "Let it ride!"
 vav_roulette.5.desc: "The ball settles on #T [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_rl_number_display')|0] Black#!.\n\nThe bet pays off and the chips pile up in front of the Overseer."

 vav_roulette.3.title: "No Luck"
 vav_roulette.3.desc: "The ball settles on #R [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_rl_number_display')|0] Red#!.\n\nThe croupier rakes in the chips. Not tonight."
 vav_roulette.3.a: "The wheel will turn again."
 vav_roulette.6.desc: "The ball settles on #T [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_rl_number_display')|0] Black#!.\n\nThe croupier rakes in the chips. Not tonight."
 vav_roulette.7.desc: "The ball settles on #G 0 Green#! - the house's number.\n\nThe croupier rakes in every chip on the table."

 vav_roulette.4.title: "Zero!"
 vav_roulette.4.desc: "Against all odds the ball drops into the #G green zero#!. Thirty-five to one! The whole casino roars, and the dwellers carry the Overseer around the table on their shoulders."
 vav_roulette.4.a: "Fortune favours the bold!"

 # ---------------------------------------------------------------------------
 # Caravan (events/vaults/vav_caravan.txt)
 # ---------------------------------------------------------------------------
 vav_caravan.1.title: "Caravan - Turn [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_turn_display')|0] of 9"
 vav_caravan.1.desc: "Your card: #T [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_card_display')|0]#!\n\n#T Your caravans#!\nI: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p1_display')|0]   II: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p2_display')|0]   III: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p3_display')|0]\n\n#T Opponent's caravans#!\nI: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o1_display')|0]   II: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o2_display')|0]   III: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o3_display')|0]   (last card played: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_ocard_display')|0])\n\nA caravan is sold with #P 21 to 26#! points. Over 26 it is busted."
 vav_caravan.1.a: "Add it to caravan I."
 vav_caravan.1.b: "Add it to caravan II."
 vav_caravan.1.c: "Add it to caravan III."
 vav_caravan.1.d: "Discard the card."

 vav_caravan.2.title: "Caravan Won"
 vav_caravan.2.desc: "#T Final caravans#!\nYou: I [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p1_display')|0] / II [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p2_display')|0] / III [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p3_display')|0]\nOpponent: I [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o1_display')|0] / II [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o2_display')|0] / III [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o3_display')|0]\n\nCaravans won: #P [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_pwins_display')|0]#! to [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_owins_display')|0]. Your opponent throws down the cards in disgust - the pot is yours."
 vav_caravan.2.a: "Ride on, caravan."

 vav_caravan.3.title: "Caravan Lost"
 vav_caravan.3.desc: "#T Final caravans#!\nYou: I [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p1_display')|0] / II [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p2_display')|0] / III [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p3_display')|0]\nOpponent: I [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o1_display')|0] / II [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o2_display')|0] / III [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o3_display')|0]\n\nCaravans won: #N [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_pwins_display')|0]#! to [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_owins_display')|0]. Your opponent grins and sweeps up the pot."
 vav_caravan.3.a: "I want a rematch."

 vav_caravan.4.title: "Caravan Drawn"
 vav_caravan.4.desc: "#T Final caravans#!\nYou: I [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p1_display')|0] / II [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p2_display')|0] / III [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_p3_display')|0]\nOpponent: I [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o1_display')|0] / II [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o2_display')|0] / III [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vav_cv_o3_display')|0]\n\nNeither of you managed to win two caravans. The pot stays on the table for another night."
 vav_caravan.4.a: "A fair game."
