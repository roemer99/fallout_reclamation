l_english:
 flavor_vaults.1.title: "One Year Under the Surface"
 flavor_vaults.1.desc: "It has been precisely one year since the lead-lined gates were struck shut, severing our people from the sun-drenched lands of our ancestors. What was initially a desperate scramble for sanctuary has, through sheer toil and the cold necessity of survival, evolved into a functioning subterranean state. The hum of the atmospheric regulators has replaced the wind, and the sterile glow of the corridors has become our only firmament.\n\nHowever, as the anniversary of the Sealing approaches, the internal pressures of our secluded life have begun to manifest. While the common citizenry looks for a reprieve to celebrate our continued existence, the keepers of our dwindling resources warn that any diversion of power or rations for the sake of sentimentality is a luxury we can ill afford. We stand at a crossroads between fostering the morale of a displaced people and the ruthless pragmatism required to see a second year."
 flavor_vaults.1.a: "Celebrate Our Survival"
 flavor_vaults.1.b: "Preserve Our Ressources"
 flavor_vaults.2.title: "The First Child of the Vault"
 flavor_vaults.2.desc: "For the first time since the great door rolled shut, the cry of a newborn echoes through the steel corridors. The medical bay reports a healthy child, the first dweller who has never known the world above.\n\nWord spreads quickly from the living quarters to the reactor level. For many, this child is proof that the Vault is no longer merely a shelter in which to wait, but a home in which to live."
 flavor_vaults.2.a: "A new generation begins."
 flavor_vaults.3.title: "The Vault Has Failed"
 flavor_vaults.3.desc: "The water purifiers have run dry, the reactor has gone cold and the last ration crates stand empty. The systems that kept the Vault alive since the bombs fell have failed one after another.\n\nIn the darkness of the corridors, dwellers turn on each other and on the Overseer. Whatever remains of the Vault must now fight for its very survival."
 flavor_vaults.3.a: "We are on our own now."
 STATIC_MODIFIER_NAME_vault_collapsed: "Vault Collapse"
 STATIC_MODIFIER_DESC_vault_collapsed: "Water, energy and food have all run out. The Vault is collapsing."