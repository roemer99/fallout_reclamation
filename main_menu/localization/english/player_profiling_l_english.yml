 #FLAVOUR TEXTS

 #Scenario Descriptions

#Economy
 VDD_scenario_desc: "The Great War has just ended, but the true struggle inside #W Vault 81#! has only begun. Originally designed as a gruesome medical testing facility, the original Overseer sabotaged the system, trapping the Vault-Tec scientists in a secret wing and protecting the general population. In these early days of 2078, the vault must focus on careful internal resource management and economic stability while completely cut off from the radioactive hellscape above, all while a shadow war brews over the hidden, surviving scientists."
 VAV_scenario_desc: "As radioactive dust settles over the Mojave, #W Vault 21#! has begun implementing its unique Vault-Tec mandate: a society where all conflicts, resource distribution, and laws are resolved strictly through gambling. In these formative months, the residents must adapt to this radical economic equality. If they can successfully establish a stable internal economy based entirely on chance, luck, and risk management, they might just build a resilient society capable of outlasting the apocalypse."

 #Politics
 VAI_scenario_desc: "Equipped with a functioning G.E.C.K. and scheduled to open in just ten years, the residents of #W Vault 8#! view themselves as the pure preservation of American society. The doors have barely closed, yet strict political structures and rigid citizenship protocols are already being heavily enforced. The political focus in 2078 lies in maintaining absolute order, avoiding the panic of the post-war reality, and laying the bureaucratic foundation for a future, elitist utopia."
 VDX_scenario_desc: "The heavy gear door of #W Vault 101#! has sealed shut, and the Overseer's absolute authority is now the only law. Designed with the secret intent to never open, the vault's early political climate is defined by the fresh trauma of the atomic fire and the enforcement of total isolationism. The Overseer must quickly consolidate executive power, establish a loyal security force, and crush any immediate panic or dissent to ensure the vault remains a closed, autocratic ecosystem forever."

 #Expansion
 VAP_scenario_desc: "Vault-Tec's most volatile social experiment has officially commenced. Crammed into #W Vault 15#! is an extremely diverse population of wildly contrasting ideologies, cultures, and radical beliefs. Though they are scheduled to remain locked away for 50 years, demographic pressure and political friction are already reaching boiling points. Factions are rapidly forming in the cramped corridors. The focus now is on expanding internal influence, managing explosive population dynamics, and surviving the inevitable culture wars inside."
 VCY_scenario_desc: "Comprised of America's best and brightest, the residents of #W Vault 76#! survived the nuclear holocaust with a clear, unified purpose: to one day rebuild the nation. Although Reclamation Day is still over twenty years away, the vault is already a hive of preparation. The focus is on aggressive demographic planning, rigorous survival training, and optimizing their mobile C.A.M.P. technologies. They must lay the logistical groundwork today to rapidly expand across Appalachia tomorrow."