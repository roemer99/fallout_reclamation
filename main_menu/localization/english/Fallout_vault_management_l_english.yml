 ### Disaster: Radiation Contamination (common/disasters/radiation_contamination.txt)
 radiation_contamination: "Radiation Contamination"
 radiation_contamination_desc: "Our capital lies in contaminated land. Fallout poisons the soil, the water and the people, and production suffers. The disaster ends once the radiation has decayed far enough."

 ### Situation: Radiation (removed, now a disaster)
 nuclear_fallout: "Radiation"
 nuclear_fallout_desc: "The fallout of the Great War still lingers over the world. Background radiation poisons every land, while the places where the bombs fell remain deadly for years to come."
 nuclear_fallout_never_ends: "The world is clean again"
 nuclear_fallout_never_ends_tt: "The radiation of the Great War will never fully disappear."

 # Panel (gui/panels/situation/nuclear_fallout.gui)
 FALLOUT_RAD_CAPITAL_TITLE: "#T Radiation in our capital#!"
 FALLOUT_RAD_CAPITAL_VALUE: "[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_capital_radiation_display')|1] (Ground zero at game start: 100)"
 FALLOUT_RAD_BACKGROUND_TITLE: "#T Background radiation#!"
 FALLOUT_RAD_BACKGROUND_VALUE: "[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_rad_background_display')|1] everywhere in the world"
 FALLOUT_RAD_DECAY_TITLE: "#T Decay#!"
 FALLOUT_RAD_DECAY_DESC: "Radiation around the strike sites decays with real half-lives: Iodine-131 (8 days), Caesium-134 (2.1 years) and Caesium-137 (30 years). Ground zero slowly spreads contaminated dust into the surrounding lands. Background radiation does not decay on its own."
