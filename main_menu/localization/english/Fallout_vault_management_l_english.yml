 # Vault 76: Preparation for Reclamation Day
 VAULT_MGMT_VCY_TITLE: "#T Preparation for Reclamation Day#!"
 VAULT_MGMT_VCY_PCT: "#bold [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vcy_reclamation_progress')|0]%#!"
 VAULT_MGMT_VCY_COUNTDOWN: "Reclamation Day in: #T [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('fallout_vcy_reclamation_years_left')|1] years#! (23 October 2102)"
 VAULT_MGMT_VCY_DESC: "Vault 76 was built to house America's best and brightest, and it was always meant to open again. On Reclamation Day, twenty-five years after the bombs, its dwellers will step out to rebuild the nation. Until then every day is spent on training, planning and preparing the C.A.M.P. technology they will need out there."

